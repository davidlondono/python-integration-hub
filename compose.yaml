services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://integration_hub@db:5432/integration_hub
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://integration_hub@db:5432/integration_hub
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://integration_hub@db:5432/integration_hub
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: integration_hub
      POSTGRES_USER: integration_hub
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration_hub -d integration_hub"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
